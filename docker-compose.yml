services:
  mysql:
    image: mysql:8.0
    container_name: structexam-mysql
    environment:
      MYSQL_ROOT_PASSWORD: structexam123
      MYSQL_DATABASE: structexam
      MYSQL_INIT_COMMAND: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: structexam-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: structexam-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos"]
      interval: 15s
      timeout: 10s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: structexam-gateway
    cpus: '2'
    mem_limit: 1g
    environment:
      NACOS_HOST: nacos
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      JWT_SECRET: structexam-secret-key-for-jwt-token-generation
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    container_name: structexam-user-service
    cpus: '1'
    mem_limit: 512m
    environment:
      NACOS_HOST: nacos
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: structexam123
      REDIS_HOST: redis
      JWT_SECRET: structexam-secret-key-for-jwt-token-generation
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  exam-service:
    build:
      context: .
      dockerfile: Dockerfile.exam-service
    container_name: structexam-exam-service
    cpus: '1'
    mem_limit: 512m
    environment:
      NACOS_HOST: nacos
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: structexam123
      REDIS_HOST: redis
      TZ: Asia/Shanghai
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  code-service:
    build:
      context: .
      dockerfile: Dockerfile.code-service
    container_name: structexam-code-service
    cpus: '1'
    mem_limit: 512m
    environment:
      NACOS_HOST: nacos
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: structexam123
      REDIS_HOST: redis
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  sandbox-node-1:
    build:
      context: .
      dockerfile: Dockerfile.sandbox-node
    container_name: structexam-sandbox-node-1
    cpus: '1'
    mem_limit: 512m
    environment:
      NACOS_HOST: nacos
      SERVER_PORT: 8084
      SANDBOX_MAX_CONCURRENCY: 4
    ports:
      - "18091:8084"
    depends_on:
      nacos:
        condition: service_healthy

  sandbox-node-2:
    build:
      context: .
      dockerfile: Dockerfile.sandbox-node
    container_name: structexam-sandbox-node-2
    cpus: '1'
    mem_limit: 512m
    environment:
      NACOS_HOST: nacos
      SERVER_PORT: 8084
      SANDBOX_MAX_CONCURRENCY: 4
    ports:
      - "18092:8084"
    depends_on:
      nacos:
        condition: service_healthy

  sandbox-node-3:
    build:
      context: .
      dockerfile: Dockerfile.sandbox-node
    container_name: structexam-sandbox-node-3
    cpus: '1'
    mem_limit: 512m
    environment:
      NACOS_HOST: nacos
      SERVER_PORT: 8084
      SANDBOX_MAX_CONCURRENCY: 4
    ports:
      - "18093:8084"
    depends_on:
      nacos:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: structexam-frontend
    cpus: '0.5'
    mem_limit: 256m
    ports:
      - "80:80"
    depends_on:
      - gateway

  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    container_name: structexam-playwright
    cpus: '4'
    mem_limit: 4g
    environment:
      E2E_BASE_URL: http://frontend
      E2E_STUDENT_USERNAME: jmeter_docker_01
      E2E_STUDENT_PASSWORD: StructExam123
      E2E_TEACHER_USERNAME: teacher01
      E2E_TEACHER_PASSWORD: StructExam123
      E2E_ADMIN_USERNAME: admin01
      E2E_ADMIN_PASSWORD: StructExam123
    volumes:
      - ./tests:/app/tests
      - test-results:/app/test-results
    depends_on:
      - frontend

  jmeter:
    image: structexam-jmeter:latest
    container_name: structexam-jmeter
    cpus: '4'
    mem_limit: 4g
    volumes:
      - ./tests/jmeter:/test
      - jmeter-results:/test/results
    working_dir: /test
    command: tail -f /dev/null
    environment:
      - JMETER_HOST=gateway
      - JMETER_PORT=8080
    depends_on:
      - gateway

volumes:
  mysql_data:
  test-results:
  jmeter-results:
