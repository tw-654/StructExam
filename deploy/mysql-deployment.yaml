apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: structexam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "StructExam@123"
        - name: MYSQL_DATABASE
          value: "structexam"
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: structexam
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi