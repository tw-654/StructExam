services:
  tester:
    image: python:3.9-slim
    container_name: code-submit-tester
    volumes:
      - ./test.py:/test.py
      - ./results:/results
    command: >
      bash -c "pip install requests -q && python /test.py"
    networks:
      - structexam_default

networks:
  structexam_default:
    external: true